# Configuración de Producción
spring.config.activate.on-profile=prod

# Database - Variables de entorno obligatorias
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA - No mostrar SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT - Variables de entorno obligatorias
# jwt.secret=${JWT_SECRET} - Ya está en application.properties base
# jwt.expiration=${JWT_EXPIRATION:86400000} - Ya está en application.properties base

# Logging - Solo errores y warnings
logging.level.root=WARN
logging.level.com.redcomunitaria.backend=INFO

# Swagger - Deshabilitado en producción
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator - Solo health endpoint
management.endpoints.web.exposure.include=health
